<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photo Puzzle — Match pieces to tags</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Photo Puzzle</h1>
      <p class="subtitle">Split images into N pieces, mix them, then match each piece to its tag.</p>
    </header>

    <section class="setup" id="setup">
      <div class="setup-row">
        <label>
          <span>Images (order = tag order)</span>
          <input type="file" id="files" accept="image/*" multiple />
        </label>
        <label>
          <span>Tags (one per line, same order as images)</span>
          <textarea id="tags" rows="6" placeholder="Beach&#10;Mountain&#10;City&#10;..."></textarea>
        </label>
      </div>
      <button type="button" id="startBtn" disabled>Start puzzle</button>
      <p class="hint">Use 2–25 images. Each image is split into N pieces; one random piece from each image forms the puzzle.</p>
    </section>

    <section class="game hidden" id="game">
      <div class="game-header">
        <p class="instruction">Click a puzzle piece, then click the correct tag.</p>
        <div class="tags-list" id="tagsList"></div>
      </div>
      <div class="puzzle-wrap">
        <div class="puzzle-grid" id="puzzleGrid"></div>
      </div>
      <div class="reconstructed-wrap">
        <h3>Reconstructed</h3>
        <div class="reconstructed-grid" id="reconstructedGrid"></div>
      </div>
      <div class="feedback hidden" id="feedback"></div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
